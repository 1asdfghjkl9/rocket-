<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Program</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
    #app { width: 100vw; height: 100vh; }
    canvas { display: block; }

    /* === START MENU === */
    #start-menu {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(ellipse at center, #0a0a2e 0%, #000005 100%);
      z-index: 1000; display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .menu-stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .menu-star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }
    .menu-content { text-align: center; z-index: 1; position: relative; }
    .game-title {
      font-size: 5rem; font-weight: 900; letter-spacing: 0.15em;
      background: linear-gradient(135deg, #4af 0%, #4fa 50%, #af4 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; text-shadow: 0 0 60px rgba(64,170,255,0.3);
      margin-bottom: 0.5rem; line-height: 1.1;
    }
    .game-subtitle { font-size: 1.1rem; color: #88aacc; margin-bottom: 2.5rem; letter-spacing: 0.2em; }
    .menu-buttons { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .menu-btn {
      padding: 14px 60px; font-size: 1rem; font-weight: 600; letter-spacing: 0.1em;
      background: rgba(30,60,100,0.5); border: 1px solid rgba(80,160,255,0.4);
      color: #fff; cursor: pointer; border-radius: 4px; transition: all 0.2s;
      min-width: 260px; backdrop-filter: blur(8px);
    }
    .menu-btn:hover { background: rgba(50,100,180,0.7); border-color: rgba(100,200,255,0.8); transform: translateY(-1px); }
    .menu-btn.primary {
      background: linear-gradient(135deg, rgba(64,128,255,0.6), rgba(64,255,170,0.4));
      border-color: rgba(100,200,255,0.6); font-size: 1.1rem; padding: 16px 70px;
    }
    .menu-btn.primary:hover { background: linear-gradient(135deg, rgba(80,150,255,0.8), rgba(80,255,180,0.6)); }
    .quality-selector, .credits-panel {
      background: rgba(10,20,40,0.85); border: 1px solid rgba(80,160,255,0.3);
      border-radius: 8px; padding: 30px; max-width: 400px; margin: 0 auto;
    }
    .quality-selector h3, .credits-panel h3 { margin-bottom: 15px; color: #4af; }
    .quality-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .quality-options label { cursor: pointer; padding: 8px; border-radius: 4px; transition: background 0.2s; }
    .quality-options label:hover { background: rgba(50,100,180,0.3); }
    .quality-hint { font-size: 0.85rem; color: #668; margin-bottom: 15px; }
    .credits-panel p { margin-bottom: 8px; color: #aac; font-size: 0.9rem; }
    .menu-footer { margin-top: 30px; font-size: 0.75rem; color: #445; }

    /* === LOADING SCREEN === */
    #loading-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,5,0.95); z-index: 1001;
    }
    .loading-content { text-align: center; }
    .loading-content h2 { font-size: 1.8rem; letter-spacing: 0.3em; color: #4af; margin-bottom: 20px; }
    .loading-bar-container {
      width: 300px; height: 4px; background: rgba(50,100,200,0.2);
      border-radius: 2px; overflow: hidden; margin: 0 auto 15px;
    }
    .loading-bar {
      height: 100%; width: 0%; background: linear-gradient(90deg, #4af, #4fa);
      transition: width 0.3s ease; border-radius: 2px;
    }
    #loading-text { font-size: 0.85rem; color: #88aacc; }

    /* === HUD === */
    #hud { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 100; }
    #hud-top-left { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 4px; }
    #hud-top-right { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
    #hud-bottom-left { position: absolute; bottom: 10px; left: 10px; }
    #hud-bottom-center { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; }
    #hud-bottom-right { position: absolute; bottom: 10px; right: 10px; }
    .hud-panel {
      background: rgba(0,10,30,0.7); border: 1px solid rgba(60,120,200,0.3);
      border-radius: 4px; padding: 4px 10px; min-width: 100px; backdrop-filter: blur(4px);
    }
    .hud-label { font-size: 0.6rem; color: #4a8; letter-spacing: 0.1em; text-transform: uppercase; }
    .hud-value { font-size: 0.9rem; font-family: 'Courier New', monospace; color: #ddf; }
    .hud-orbit-info { font-size: 0.75rem; color: #8ac; font-family: monospace; line-height: 1.4; }

    /* Fixed throttle & fuel bars */
    #throttle-bar-container, #fuel-bar-container { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .throttle-bar-bg, .fuel-bar-bg {
      width: 12px; height: 80px; background: rgba(0,0,0,0.6);
      border: 1px solid rgba(100,200,255,0.3); border-radius: 2px; position: relative; overflow: hidden;
      display: flex; flex-direction: column-reverse;
    }
    #throttle-bar-fill {
      width: 100%; background: linear-gradient(to top, #ff6633, #ffaa44);
      transition: height 0.1s ease; border-radius: 0;
    }
    #fuel-bar-fill {
      width: 100%; background: linear-gradient(to top, #44ff88, #88ffaa);
      transition: height 0.1s ease; border-radius: 0;
    }
    #throttle-text, #fuel-text { font-size: 0.7rem; color: #88aacc; font-family: monospace; }

    #time-warp-display {
      position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
      background: rgba(0,10,30,0.8); border: 1px solid rgba(60,120,200,0.3);
      border-radius: 4px; padding: 8px 15px; text-align: center;
    }
    #warp-level { font-size: 1.5rem; font-weight: bold; color: #4fa; font-family: monospace; }
    .warp-hint { font-size: 0.6rem; color: #668; }
    #navball { border: 1px solid rgba(100,200,255,0.3); border-radius: 50%; background: rgba(0,0,20,0.5); }

    /* === HELP OVERLAY === */
    #help-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center;
      z-index: 200; pointer-events: auto;
    }
    .help-content {
      background: rgba(10,20,40,0.95); border: 1px solid rgba(80,160,255,0.4);
      border-radius: 8px; padding: 30px; max-width: 500px;
    }
    .help-content h2 { color: #4af; margin-bottom: 20px; text-align: center; }
    .help-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 20px; margin-bottom: 20px; }
    .help-grid kbd {
      background: rgba(60,120,200,0.3); border: 1px solid rgba(100,200,255,0.4);
      border-radius: 3px; padding: 2px 8px; font-family: monospace; font-size: 0.85rem;
    }
    .help-content button {
      padding: 10px 40px; background: rgba(50,100,180,0.5); border: 1px solid rgba(100,200,255,0.4);
      color: #fff; border-radius: 4px; cursor: pointer; display: block; margin: 0 auto;
    }
    .help-content button:hover { background: rgba(70,130,220,0.7); }

    /* === STAR MAP === */
    .star-map-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center;
      z-index: 300; pointer-events: auto;
    }
    .star-map-content {
      background: rgba(10,20,40,0.95); border: 1px solid rgba(80,160,255,0.4);
      border-radius: 8px; padding: 25px; max-width: 500px; max-height: 80vh; overflow-y: auto;
    }
    .star-map-content h2 { color: #4af; margin-bottom: 15px; text-align: center; }
    .star-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 15px; }
    .star-item {
      display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; padding: 8px 12px;
      background: rgba(30,50,80,0.4); border-radius: 4px; cursor: pointer; transition: background 0.2s;
    }
    .star-item:hover { background: rgba(50,100,180,0.6); }
    .star-name { color: #ddf; font-weight: 600; }
    .star-type { color: #8ac; font-size: 0.85rem; }
    .star-dist { color: #4fa; font-size: 0.85rem; text-align: right; }
    .star-map-content button {
      padding: 10px 40px; background: rgba(50,100,180,0.5); border: 1px solid rgba(100,200,255,0.4);
      color: #fff; border-radius: 4px; cursor: pointer; display: block; margin: 0 auto;
    }

    /* === NOTIFICATIONS === */
    .notification {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(10,30,60,0.9); border: 1px solid rgba(100,200,255,0.5);
      color: #ddf; padding: 10px 25px; border-radius: 4px; font-size: 0.9rem;
      z-index: 400; animation: fadeInOut 3s ease forwards; pointer-events: none;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./dist/bundle.js"></script>
  <script>
    window.addEventListener('error', function(e) {
      var msg = document.createElement('div');
      msg.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a3a;color:#ff6666;padding:20px 40px;border-radius:8px;font-family:monospace;font-size:14px;z-index:9999;white-space:pre-wrap;max-width:80vw;word-break:break-all;border:1px solid #ff4444;';
      msg.textContent = 'Error: ' + (e.message || 'Unknown error') + '\n' + (e.filename||'') + ':' + (e.lineno||'');
      document.body.appendChild(msg);
    });
  </script>
</body>
</html>
